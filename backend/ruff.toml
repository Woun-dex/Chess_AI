target-version = "py312"
line-length = 100

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length violations handled by ruff format
    "B008",   # FastAPI Depends() in argument defaults is standard idiom
    "RUF002", # Ambiguous unicode characters in docstrings
]

[lint.isort]
known-first-party = ["chess_ai"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

