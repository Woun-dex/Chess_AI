services:
  postgres:
    image: postgres:16-alpine
    container_name: chess_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chess_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chess_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess_ai_backend
    restart: unless-stopped
    command: uvicorn chess_ai.presentation.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/chess_ai
      - REDIS_URL=redis://redis:6379/0
      - STOCKFISH_PATH=/usr/games/stockfish
      - LLM_PROVIDER=ollama
      - LLM_MODEL_NAME=gemma2:9b
      - LLM_BASE_URL=http://host.docker.internal:11434
      - APP_ENV=development
      - DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess_ai_worker
    restart: unless-stopped
    command: celery -A chess_ai.infrastructure.queue.celery_app:celery_app worker --loglevel=INFO --concurrency=2 --queues=analysis
    volumes:
      - ./backend/src:/app/src
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/chess_ai
      - REDIS_URL=redis://redis:6379/0
      - STOCKFISH_PATH=/usr/games/stockfish
      - LLM_PROVIDER=ollama
      - LLM_MODEL_NAME=gemma2:9b
      - LLM_BASE_URL=http://host.docker.internal:11434
      - APP_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    container_name: chess_ai_frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
